reasons:
  - title: تخصص علمی در بالاترین سطح ملی
    description: مسیر تحصیلی و گواهی‌های دکتر سامی نشان‌دهنده عمق دانش در بیماری‌های داخلی، ریه و مراقبت‌های ویژه است.
    points:
      - رتبه دوازدهم کنکور سراسری ورود به پزشکی (۱۳۷۳)
      - رتبه هفتم دانشنامه تخصصی بیماری‌های داخلی و رتبه اول دانشنامه فوق تخصصی ریه در سطح کشور
      - دوره‌های تخصصی برونکوسکوپی مداخله‌ای در ایران و Thoraxklinik هایدلبرگ آلمان
  - title: تجربه بالینی و مدیریتی گسترده
    description: سال‌ها فعالیت به‌عنوان هیئت علمی، رئیس بیمارستان و عضو انجمن‌های ملی، نگاه جامع به تشخیص، درمان و سازمان‌دهی مراقبت بیمار ایجاد کرده است.
    points:
      - هیئت علمی دانشگاه‌های علوم پزشکی قزوین و اصفهان از سال ۱۳۹۰
      - ریاست بیمارستان‌های ولایت قزوین و خورشید اصفهان
      - عضویت در هیئت‌مدیره انجمن متخصصین ریه ایران و کمیته علمی ملی کووید‑۱۹
  - title: پیشگام در خدمات تخصصی ریه در اصفهان
    description: راه‌اندازی بخش‌ها و کلینیک‌های تخصصی، دسترسی بیماران به روش‌های پیشرفته تشخیصی و درمانی را ممکن کرده است.
    points:
      - بنیان‌گذار بخش برونکوسکوپی مداخله‌ای در قزوین و اصفهان
      - بنیان‌گذار کلینیک بازتوانی ریوی اصفهان
      - اختراع جلیقه تولید فرکانس مکانیکی برای درمان برونشکتازی (۱۳۹۴)
  - title: رویکرد آموزشی و مبتنی بر شواهد
    description: تدریس دانشگاهی، تألیف و ترجمه راهنماهای ملی و انتشار مقالات بین‌المللی، درمان را بر پایه دانش روز نگه می‌دارد.
    points:
      - آموزش پاتوفیزیولوژی و آموزش بالینی بیماری‌های ریه برای دانشجویان و دستیاران
      - ویراستاری و تألیف منابعی مانند تهویه مکانیکی، اکسیژن‌درمانی، راهنمای ملی COPD و خودمراقبتی COPD
      - ده‌ها مقاله بین‌المللی و ارائه در کنگره‌های ERS
specialtiesIntro: |
  دکتر رامین سامی خدمات تشخیصی، مشاوره‌ای و درمانی بیماری‌های ریه و دستگاه تنفس را بر اساس رویکرد علمی و تجربه بالینی ارائه می‌کند. از آسم و COPD تا برونکوسکوپی مداخله‌ای، آپنه خواب و غربالگری سرطان ریه، برنامه مراقبت متناسب با شرایط هر بیمار طراحی می‌شود.
specialties:
  - title: آسم و آلرژی‌های تنفسی
    serviceSlug: asthma-allergy
    items:
      - تشخیص و درمان آسم در کودکان و بزرگسالان
      - مدیریت آلرژی‌های تنفسی
      - کنترل علائم و بهبود کیفیت زندگی
  - title: بیماری‌های مزمن انسدادی ریه (COPD)
    serviceSlug: copd
    items:
      - برنامه‌ریزی درمانی جامع COPD
      - دارودرمانی، بازتوانی ریوی و آموزش خودمراقبتی
      - کاهش تشدیدها و کند کردن پیشرفت بیماری
  - title: برونکوسکوپی تشخیصی و درمانی
    serviceSlug: bronchoscopy
    items:
      - برونکوسکوپی مداخله‌ای با تجهیزات پیشرفته
      - نمونه‌برداری (بیوپسی) و تشخیص دقیق
      - اقدامات درمانی داخل راه هوایی
  - title: تست‌های عملکرد ریوی (اسپیرومتری)
    serviceSlug: spirometry
    items:
      - ارزیابی ظرفیت و عملکرد ریه‌ها
      - کمک به تشخیص صحیح بیماری‌های تنفسی
      - پایش روند درمان
  - title: بیماری‌های بینابینی ریه و فیبروز
    serviceSlug: ild-fibrosis
    items:
      - تشخیص و مدیریت فیبروز ریوی و ILD
      - کند کردن روند بیماری
      - حفظ عملکرد تنفسی
  - title: اختلالات تنفسی مرتبط با خواب
    serviceSlug: sleep-apnea
    items:
      - بررسی و درمان آپنه خواب
      - بهبود کیفیت خواب و کاهش خستگی روزانه
      - پیشگیری از عوارض قلبی‌عروقی
  - title: غربالگری و تشخیص زودهنگام سرطان ریه
    serviceSlug: lung-cancer-screening
    items:
      - غربالگری افراد در معرض خطر
      - تشخیص مراحل اولیه
      - افزایش شانس موفقیت درمان
  - title: مشاوره تخصصی ریه و نظر دوم
    serviceSlug: consultation
    items:
      - مشاوره پیش از جراحی‌های سنگین
      - بررسی پرونده‌های پیچیده (نظر دوم)
      - راهنمایی برای انتخاب بهترین مسیر درمانی
