seo:
  title: درباره دکتر رامین سامی
  description: دکتر رامین سامی، دانشیار بیماری‌های ریه دانشگاه علوم پزشکی اصفهان — فوق تخصص ریه و ICU، رتبه اول دانشنامه فوق تخصصی، ریاست بیمارستان خورشید و خدمات تخصصی تنفسی در اصفهان.
title: درباره دکتر رامین سامی
description: فوق تخصص بیماری‌های ریه و ICU | دانشیار دانشگاه علوم پزشکی اصفهان
intro: |
  دکتر رامین سامی دانشیار گروه بیماری‌های ریه دانشکده پزشکی دانشگاه علوم پزشکی اصفهان است. ایشان پس از ورود به دانشگاه علوم پزشکی اصفهان در سال ۱۳۷۳ و طی دوره‌های تخصصی و فوق تخصصی، در سال ۱۳۹۰ با کسب رتبه اول دانشنامه فوق تخصصی بیماری‌های ریه از دانشگاه علوم پزشکی شهید بهشتی تهران فارغ‌التحصیل شد و از همان زمان به‌عنوان هیئت علمی دانشگاه فعالیت می‌کند.

  ترکیب تجربه بالینی گسترده در تشخیص و درمان بیماری‌های تنفسی، برونکوسکوپی مداخله‌ای، مدیریت بیمارستانی و آموزش دانشگاهی باعث می‌شود مراقبت در کلینیک ایشان علمی، دقیق و قابل پیگیری باشد.
image:
  src: /images/profilePic.png
  alt: تصویر دکتر رامین سامی
sections:
  credentials: تحصیلات و سوابق حرفه‌ای
  whyChoose: چرا مراجعه به دکتر رامین سامی می‌تواند برای شما نتیجه‌ساز باشد؟
  highlights: ویژگی‌های برجسته
  specialties: حوزه‌های تخصصی و خدمات
credentials:
  - دکترای حرفه‌ای پزشکی (MD) — دانشگاه علوم پزشکی اصفهان (۱۳۷۳–۱۳۸۰)
  - تخصص بیماری‌های داخلی — دانشگاه علوم پزشکی شهید صدوقی یزد (۱۳۸۲–۱۳۸۶)؛ رتبه هفتم دانشنامه تخصصی داخلی کشور
  - دوره کوتاه‌مدت آندوسکوپی فوقانی گوارش (۳ ماه) — دانشگاه علوم پزشکی شهید صدوقی یزد (۱۳۸۶)
  - فوق تخصص بیماری‌های ریه — دانشگاه علوم پزشکی شهید بهشتی تهران (۱۳۸۸–۱۳۹۰)؛ رتبه اول دانشنامه فوق تخصصی ریه کشور
  - دوره برونکوسکوپی مداخله‌ای (۶ ماه) — پژوهشکده ملی سل و بیماری‌های ریوی (NRITLD) (۱۳۹۰)
  - دوره برونکوسکوپی مداخله‌ای (۱ ماه) — Thoraxklinik، هایدلبرگ، آلمان (۱۳۹۴)
  - هیئت علمی دانشگاه علوم پزشکی قزوین (۱۳۹۰–۱۳۹۴) و دانشگاه علوم پزشکی اصفهان (۱۳۹۴ تاکنون)
  - رئیس بیمارستان ولایت قزوین (۱۳۹۱–۱۳۹۴) و رئیس بیمارستان خورشید اصفهان (۱۳۹۶ تاکنون)
  - عضو هیئت‌مدیره انجمن متخصصین ریه ایران و عضو کمیته علمی ملی کووید‑۱۹
  - بنیان‌گذار بخش برونکوسکوپی مداخله‌ای (قزوین ۱۳۹۴ و اصفهان ۱۳۹۶) و کلینیک بازتوانی ریوی اصفهان (۱۳۹۸)
