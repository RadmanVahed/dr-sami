reasons:
  - title: National-level academic excellence
    description: Dr. Sami’s training and certifications reflect deep expertise in internal medicine, pulmonology, and critical care.
    points:
      - Ranked 12th in the national university entrance exam for medicine (1994)
      - 7th on the national Internal Medicine Board and 1st on the national Pulmonary Medicine Board
      - Advanced interventional bronchoscopy training in Iran and at Thoraxklinik Heidelberg, Germany
  - title: Broad clinical and leadership experience
    description: Years as a faculty member, hospital head, and national society leader bring a comprehensive view of diagnosis, treatment, and care organization.
    points:
      - University faculty since 2011 at Qazvin and Isfahan medical universities
      - Head of Velayat Hospital (Qazvin) and Khorshid Hospital (Isfahan)
      - Board of the Iranian Society of Pulmonology and national COVID-19 scientific committee
  - title: Pioneer of advanced pulmonary services
    description: Founding specialized units and clinics has expanded patient access to modern diagnostic and therapeutic methods.
    points:
      - Founder of interventional pulmonology sections in Qazvin and Isfahan
      - Founder of the pulmonary rehabilitation clinic in Isfahan
      - Patent for a mechanical-frequency vest for bronchiectasis treatment (2015)
  - title: Evidence-based, teaching-driven care
    description: University teaching, national guidelines, and international publications keep practice aligned with current science.
    points:
      - Pathophysiology and bedside teaching of pulmonary disease for students and residents
      - Editor/author of resources on mechanical ventilation, oxygen therapy, national COPD guidelines, and COPD self-care
      - Dozens of international papers and presentations at ERS congresses
specialtiesIntro: |
  Dr. Ramin Sami provides diagnostic, counseling, and therapeutic care for lung and respiratory diseases with a scientific, experience-based approach. From asthma and COPD to interventional bronchoscopy, sleep apnea, and lung cancer screening, care plans are tailored to each patient.
specialties:
