seo:
  title: About Dr. Ramin Sami
  description: Dr. Ramin Sami — Associate Professor of Pulmonary Medicine at Isfahan University of Medical Sciences; pulmonary & ICU subspecialist, national board top rank, and Head of Khorshid Hospital.
title: About Dr. Ramin Sami
description: Pulmonary & ICU Subspecialist | Associate Professor, Isfahan University of Medical Sciences
intro: |
  Dr. Ramin Sami is Associate Professor of Medicine in the Department of Pulmonary Disease at Isfahan University of Medical Sciences. After entering IUMS in 1994 and completing specialty and subspecialty training, he earned the national first rank on the Pulmonary Medicine Board from Shahid Beheshti University of Medical Sciences in 2011 and has served as a university faculty member since then.

  His clinical expertise in respiratory diseases, interventional bronchoscopy, hospital leadership, and academic teaching makes care in his clinic precise, evidence-based, and carefully followed.
