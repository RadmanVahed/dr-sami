credentials:
  - Doctor of Medicine (MD) — Isfahan University of Medical Sciences (1994–2001)
  - Residency in Internal Medicine — Shahid Sadoughi University of Medical Sciences, Yazd (2003–2007); 7th nationally on the Internal Medicine Board
  - Postgraduate course in Upper GI Endoscopy (3 months) — SSUMS, Yazd (2007)
  - Clinical fellowship in Pulmonary Disease — Shahid Beheshti University of Medical Sciences, Tehran (2009–2011); 1st nationally on the Pulmonary Medicine Board
  - Interventional bronchoscopy course (6 months) — National Research Institute of Tuberculosis and Lung Diseases (NRITLD) (2011)
  - Interventional bronchoscopy course (1 month) — Thoraxklinik, Heidelberg, Germany (2015)
  - Faculty member, Qazvin University of Medical Sciences (2011–2015) and Isfahan University of Medical Sciences (2015–present)
  - Head of Velayat Hospital, Qazvin (2012–2015) and Head of Khorshid Hospital, Isfahan (2017–present)
  - Board member of the Iranian Society of Pulmonology and member of the national COVID-19 scientific committee
  - Founder of interventional pulmonology units (Qazvin 2015, Isfahan 2017) and the pulmonary rehabilitation clinic in Isfahan (2019)
