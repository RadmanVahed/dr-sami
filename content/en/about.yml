  - title: Early detection & lung cancer screening
    serviceSlug: lung-cancer-screening
    items:
      - Screening for high-risk individuals
      - Detection at earlier stages
      - Greater chance of successful treatment
  - title: Specialist pulmonary consultation & second opinion
    serviceSlug: consultation
    items:
      - Preoperative consultation for major surgery
      - Review of complex medical records (second opinion)
      - Guidance toward the best treatment path
